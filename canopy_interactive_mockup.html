                    <TemplateUploader label="Upload High-Resolution Branding Assets & Logos" formats=".png, .svg" templateName="branding_menu_assets.zip" />
                    <TextInput label="Active Discount Engine SOPs & Loyalty Program Schemes" placeholder="Describe points per dollar systems..." multiline />
                    <TemplateUploader label="Standardized Terpene Profiles & SEO Product Copy" formats=".csv, .xlsx" templateName="menu_seo_metadata.csv" />
                  </div>
                );

              default:
                return <p className="text-sm text-slate-500">Form configuration is loading for this node.</p>;
            }
          };

          const renderDataMappingTab = () => (
            <div className="space-y-6 animate-fade-in">
              <div className="border-b border-slate-200 pb-4 mb-6">
                <h3 className="text-xl font-bold text-slate-800 flex items-center">
                  <Icon name="Database" className="w-6 h-6 mr-2 text-indigo-600" /> 
                  Legacy Data Migration & Sanitation
                </h3>
                <p className="text-sm text-slate-500 mt-2 font-medium">
                  Prior to ERP synchronization, audit and structure existing data to prevent historical pollution. Upload structured templates below for automated error-checking.
                </p>
              </div>

              <div className="grid gap-6">
                {/* Module 1: Cannabis Inventory */}
                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-xs">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <h4 className="font-bold text-slate-800">1. Cannabis Inventory Validation</h4>
                      <p className="text-xs text-slate-500 font-medium">Standardize nomenclature and taxonomy for active plants and packages.</p>
                    </div>
                    <button 
                      type="button" 
                      onClick={() => triggerToast("Downloading: empty_cannabis_inventory_master.csv")}
                      className="text-xs flex items-center bg-white border border-slate-300 px-3 py-1.5 rounded hover:bg-slate-50 transition-colors font-bold text-slate-700"
                    >
                      <Icon name="FileSpreadsheet" className="w-3.5 h-3.5 mr-1 text-slate-500" /> Download Template
                    </button>
                  </div>
                  <div className="bg-white border-2 border-dashed border-slate-300 rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-400 hover:bg-emerald-50 transition-colors">
                    <Icon name="UploadCloud" className="w-8 h-8 text-slate-400 mb-2" />
                    <span className="text-sm font-semibold text-slate-600">Drop `cannabis_inventory_master.csv` here</span>
                  </div>
                  
                  {/* Mock Validation Output */}
                  <div className="mt-4 p-3 bg-rose-50 border border-rose-200 rounded-md">
                    <div className="flex items-start">
                      <Icon name="AlertTriangle" className="w-4 h-4 text-rose-500 mt-0.5 mr-2 flex-shrink-0" />
                      <div>
                        <h5 className="text-sm font-bold text-rose-700">Validation Errors Detected</h5>
                        <ul className="text-xs text-rose-600 mt-1 list-disc pl-4 space-y-1">
                          <li>Row 42: Missing Metrc UID format.</li>
                          <li>Row 105: Invalid Plant Phase assignment (expected 'Vegetative' or 'Flowering').</li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Module 2: NCI */}
                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-xs">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <h4 className="font-bold text-slate-800">2. Non-Cannabis Inventory (NCI)</h4>
                      <p className="text-xs text-slate-500 font-medium">Separate packaging materials, solvents, and culinary ingredients.</p>
                    </div>
                    <button 
                      type="button" 
                      onClick={() => triggerToast("Downloading: empty_nci_master.csv")}
                      className="text-xs flex items-center bg-white border border-slate-300 px-3 py-1.5 rounded hover:bg-slate-50 transition-colors font-bold text-slate-700"
                    >
                      <Icon name="FileSpreadsheet" className="w-3.5 h-3.5 mr-1 text-slate-500" /> Download Template
                    </button>
                  </div>
                  <div className="bg-white border-2 border-dashed border-slate-300 rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-400 hover:bg-emerald-50 transition-colors">
                    <Icon name="UploadCloud" className="w-8 h-8 text-slate-400 mb-2" />
                    <span className="text-sm font-semibold text-slate-600">Drop `nci_master.csv` here</span>
                  </div>
                </div>

                {/* Module 3: BOMs */}
                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-xs">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <h4 className="font-bold text-slate-800">3. Master Bills of Materials (BOMs)</h4>
                      <p className="text-xs text-slate-500 font-medium">Map inputs (Cannabis + NCI) to manufactured outputs.</p>
                    </div>
                    <button 
                      type="button" 
                      onClick={() => triggerToast("Downloading: empty_standard_boms.csv")}
                      className="text-xs flex items-center bg-white border border-slate-300 px-3 py-1.5 rounded hover:bg-slate-50 transition-colors font-bold text-slate-700"
                    >
                      <Icon name="FileSpreadsheet" className="w-3.5 h-3.5 mr-1 text-slate-500" /> Download Template
                    </button>
                  </div>
                  <div className="bg-white border border-slate-200 rounded-lg p-4 flex items-center justify-between shadow-xs">
                    <div className="flex items-center space-x-3">
                      <Icon name="FileText" className="w-6 h-6 text-emerald-500" />
                      <div>
                        <div className="flex items-center space-x-2">
                          <h5 className="font-bold text-slate-800 text-sm">standard_boms.csv</h5>
                          <span className="text-[10px] uppercase tracking-wider bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold">Validated</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-0.5">45 manufactured product recipes structured correctly.</p>
                      </div>
                    </div>
                    <Icon name="CheckCircle2" className="w-5 h-5 text-emerald-500" />
                  </div>
                </div>
              </div>
            </div>
          );

          const renderStep2 = () => {
            const tabs = [...getDepartmentsByModel(msoModel), 'Data Mapping'];

            return (
              <div className="flex flex-col md:flex-row h-screen max-h-[850px] bg-white border border-slate-200 rounded-xl overflow-hidden shadow-md animate-fade-in">
                
                {/* Sidebar Tabs */}
                <div className="w-full md:w-64 bg-slate-50 border-r border-slate-200 overflow-y-auto">
                  <div className="p-4 border-b border-slate-200">
                    <h2 className="font-bold text-slate-800">Onboarding Modules</h2>
                    <p className="text-xs text-slate-500 mt-1">{msoModel} Architecture</p>
                  </div>
                  <nav className="p-2 space-y-1">
                    {tabs.map((tab) => (
                      <button
                        key={tab}
                        type="button"
                        onClick={() => setActiveTab(tab)}
                        className={`w-full flex items-center justify-between px-3 py-2.5 text-sm rounded-md transition-colors ${
                          activeTab === tab 
                            ? 'bg-emerald-100 text-emerald-800 font-bold shadow-xs' 
                            : 'text-slate-600 hover:bg-slate-200 hover:text-slate-950'
                        }`}
                      >
                        <span className="truncate">{tab}</span>
                        {tab === 'Data Mapping' ? <Icon name="Database" className="w-4 h-4 opacity-50" /> : <Icon name="ChevronRight" className={`w-4 h-4 ${activeTab === tab ? 'opacity-100' : 'opacity-0'}`} />}
                      </button>
                    ))}
                  </nav>
                </div>

                {/* Main Content Area */}
                <div className="flex-1 overflow-y-auto bg-white p-6 sm:p-8">
                  <div className="max-w-3xl mx-auto">
                    {/* Show POC configuration block at the top if NOT on the final Data Mapping page */}
                    {activeTab !== 'Data Mapping' && (
                      <DepartmentPocHeaderCard dept={activeTab} />
                    )}

                    {/* Custom Form Fields */}
                    {activeTab === 'Data Mapping' ? (
                      renderDataMappingTab()
                    ) : (
                      <div className="space-y-6">
                        {renderDepartmentForm(activeTab)}
                        
                        {/* Dynamically Inject Specialty Fields for Cultivation */}
                        {activeTab === 'Cultivation' && (
                          <div className="pt-2 border-t border-slate-100 space-y-4">
                            <DestructionApprovalsTable />
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          };

          // -------------------------------------------------------------
          // STATE LICENSES COMPONENT RENDER
          // -------------------------------------------------------------
          const renderStateLicenses = () => (
            <div className="space-y-6 animate-fade-in">
              <div className="max-w-3xl">
                <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                  <Icon name="Shield" className="w-6 h-6 text-emerald-600" />
                  State Traceability Licenses & Regulatory Credentials
                </h2>
                <p className="text-sm text-slate-500 mt-1 font-medium">
                  Verify, monitor, and link multi-state Metrc & BioTrack active operator credentials. Discrepancies here can halt compliance sync events immediately.
                </p>
              </div>

              {licenseNotification && (
                <div className="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded shadow-sm text-sm text-emerald-800 font-semibold flex items-center justify-between animate-fade-in">
                  <div className="flex items-center space-x-2">
                    <Icon name="CheckCircle2" className="w-5 h-5 text-emerald-600" />
                    <span>{licenseNotification}</span>
                  </div>
                  <button onClick={() => setLicenseNotification(null)} className="text-emerald-600 hover:text-emerald-800">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
              )}

              {/* Grid of 8 Mock State Licenses */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                {licenses.map((lic) => (
                  <div key={lic.id} className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:shadow hover:border-slate-300 transition-all">
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                        {lic.state}
                      </span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                        lic.status === 'Active' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                      }`}>
                        {lic.status}
                      </span>
                    </div>
                    <h3 className="font-bold text-slate-800 text-sm">{lic.type}</h3>
                    <p className="text-xs text-slate-500 font-mono mt-2 flex items-center justify-between">
                      <span>Num:</span> <span className="font-semibold text-slate-700">{lic.num}</span>
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1 flex items-center justify-between">
                      <span>Expiration:</span> <span className="font-semibold">{lic.exp}</span>
                    </p>
                  </div>
                ))}
              </div>

              {/* License Authority Request Block */}
              <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 max-w-2xl shadow-sm">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider mb-2 flex items-center gap-2">
                  <Icon name="UserCheck" className="w-5 h-5 text-indigo-600" />
                  Request License Updates & Credentials
                </h3>
                <p className="text-xs text-slate-500 mb-4 leading-relaxed font-medium">
                  Missing key state license keys? Initiate an in-app verification request and dispatch direct link-sharing prompts to authorized team compliance officers.
                </p>

                <form onSubmit={handleSendLicenseRequest} className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                  <div className="flex-1">
                    <select
                      value={licenseRequestUser}
                      onChange={(e) => setLicenseRequestUser(e.target.value)}
                      required
                      className="w-full text-xs bg-white border border-slate-300 rounded-lg p-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none font-semibold text-slate-700"
                    >
                      <option value="">-- Select Team Authority to Prompt --</option>
                      {MOCK_USERS.map(user => (
                        <option key={user.id} value={user.id}>
                          {user.name} ({user.title})
                        </option>
                      ))}
                    </select>
                  </div>
                  <button
                    type="submit"
                    className="inline-flex items-center justify-center space-x-1.5 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition-colors shadow-sm"
                  >
                    <Icon name="Send" className="w-3.5 h-3.5" />
                    <span>Send Request</span>
                  </button>
                </form>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-900 pb-16">
              
              {/* Custom Elegant Toast Notifications */}
              {toast && (
                <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-3 rounded-lg shadow-2xl flex items-center space-x-2 border border-slate-800 animate-fade-in">
                  <Icon name="CheckSquare" className="w-4 h-4 text-emerald-400" />
                  <span>{toast}</span>
                </div>
              )}

              {/* Top Navigation & Core Header */}
              <nav className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-0 z-10 shadow-xs">
                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center shadow-sm">
                    <Icon name="Leaf" className="w-5 h-5 text-white" />
                  </div>
                  <span className="text-xl font-black tracking-tight text-slate-800">CANOPY</span>
                  <span className="text-xs font-bold bg-slate-100 text-slate-500 px-2.5 py-0.5 rounded-full ml-2">MSO Setup Suite</span>
                </div>

                {/* Dynamic step-by-step progress helper */}
                {activeMainTab === 'Onboarding' && msoModel && (
                  <div className="hidden md:flex items-center space-x-2 text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 animate-fade-in">
                    <span className={step === 1 ? 'text-emerald-700 font-extrabold' : 'text-slate-400'}>1. Operational Model</span>
                    <span className="text-slate-300">/</span>
                    <span className={step === 2 ? 'text-emerald-700 font-extrabold' : 'text-slate-400'}>2. Module Configuration</span>
                  </div>
                )}
                
                {/* Core Mode Switch: Onboarding Modules vs State Licenses */}
                <div className="flex items-center space-x-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200 shadow-inner">
                  <button
                    type="button"
                    onClick={() => setActiveMainTab('Onboarding')}
                    className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${
                      activeMainTab === 'Onboarding' 
                        ? 'bg-white text-slate-900 shadow-sm' 
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    Onboarding
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveMainTab('State Licenses')}
                    className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${
                      activeMainTab === 'State Licenses' 
                        ? 'bg-white text-slate-900 shadow-sm' 
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    State Licenses
                  </button>
                </div>
              </nav>

              {/* Main Framework Rendering Router */}
              <main className="max-w-7xl mx-auto p-4 sm:p-6">
                {activeMainTab === 'State Licenses' ? (
                  renderStateLicenses()
                ) : (
                  <div>
                    {step === 1 && renderStep1()}
                    {step === 2 && renderStep2()}
                  </div>
                )}
              </main>

              {/* Global Preview Modal */}
              {previewModal.isOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
                  <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                    <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                      <h3 className="font-semibold text-slate-800 text-sm">
                        Preview: {previewModal.dept} Intake Form
                      </h3>
                      <button 
                        type="button"
                        onClick={() => setPreviewModal({ isOpen: false, dept: '' })}
                        className="text-slate-400 hover:text-slate-600"
                      >
                        <Icon name="X" className="w-5 h-5" />
                      </button>
                    </div>
                    <div className="p-5 max-h-[500px] overflow-y-auto">
                      <p className="text-xs text-slate-500 mb-4 font-semibold leading-relaxed">
                        The designated POC for this department will be required to provide the following configuration data:
                      </p>
                      <ul className="space-y-3">
                        {getIntakePreview(previewModal.dept).map((item, i) => (
                          <li key={i} className="flex items-start bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <Icon name="CheckCircle2" className="w-4 h-4 text-emerald-500 mt-0.5 mr-2 flex-shrink-0" />
                            <div>
                              <span className="text-sm font-bold text-slate-700 block">{item.q}</span>
                              <span className="text-xs text-slate-400 mt-0.5 block">Expected Input: {item.type}</span>
                            </div>
                          </li>
                        ))}
                      </ul>
                    </div>
                    <div className="px-5 py-4 bg-slate-50 border-t border-slate-100 flex justify-end">
                      <button 
                        type="button"
                        onClick={() => setPreviewModal({ isOpen: false, dept: '' })}
                        className="px-4 py-2 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-50"
                      >
                        Close Preview
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        };

        // Render application using React 18 createRoot UMD API
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<CanopyOnboarding />);
    </script>
</body>
</html>

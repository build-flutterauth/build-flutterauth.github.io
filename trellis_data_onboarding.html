<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curaleaf Onboarding Dashboard — Prototype</title>
<meta name="description" content="Interactive prototype of the Curaleaf Enterprise Onboarding Dashboard. For review and feedback.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================================
   Design tokens — SignalMVP design system (colors_and_type.css), inlined.
   ========================================================================== */
:root{
  --blue-50:#EEF3FF;--blue-100:#DBE4FF;--blue-200:#BBCBFF;--blue-300:#93A9FF;--blue-400:#6981F8;
  --blue-500:#3B5BF0;--blue-600:#1B43E5;--blue-700:#1536C4;--blue-800:#152C99;--blue-900:#16277A;
  --white:#FFFFFF;--gray-25:#FAFBFC;--gray-50:#F4F6F9;--gray-100:#ECEFF3;--gray-150:#E5E9EF;
  --gray-200:#DDE2E9;--gray-300:#CAD0DA;--gray-400:#99A1AE;--gray-500:#6B7382;--gray-600:#4A515E;
  --gray-700:#343A45;--gray-800:#20252E;--gray-900:#0E1116;--ink:#0A0C10;
  --success:#14A05A;--success-bg:#E5F6ED;--danger:#E5484D;--danger-bg:#FCEBEB;
  --warning:#D88A00;--warning-bg:#FBF1DE;--info:var(--blue-600);--info-bg:var(--blue-50);
  --bg-canvas:var(--gray-25);--bg-surface:var(--white);--bg-inset:var(--gray-50);--bg-hover:var(--gray-100);
  --border:var(--gray-200);--border-strong:var(--gray-300);
  --fg1:var(--gray-900);--fg2:var(--gray-600);--fg3:var(--gray-500);--fg4:var(--gray-400);--fg-onaccent:#FFFFFF;
  --accent:var(--blue-600);--accent-hover:var(--blue-700);--accent-soft:var(--blue-50);--focus-ring:rgba(27,67,229,.32);
  --font-sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --font-display:var(--font-sans);
  --text-h1:700 32px/1.12 var(--font-display);--text-h2:700 24px/1.20 var(--font-display);
  --text-h3:600 19px/1.28 var(--font-display);--text-h4:600 16px/1.35 var(--font-sans);
  --text-body-lg:400 16px/1.55 var(--font-sans);--text-body:400 14px/1.55 var(--font-sans);
  --text-body-sm:400 13px/1.45 var(--font-sans);--text-caption:500 12px/1.40 var(--font-sans);
  --text-overline:600 11px/1.30 var(--font-sans);--text-metric:700 30px/1.05 var(--font-sans);
  --text-mono:500 13px/1.50 var(--font-mono);
  --tracking-tight:-.02em;--tracking-snug:-.01em;--tracking-wide:.06em;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-2xl:22px;--radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);--shadow-lg:0 12px 32px rgba(16,24,40,.10);
  --shadow-xl:0 24px 56px rgba(16,24,40,.14);--ring-focus:0 0 0 3px var(--focus-ring);
}
.sm-overline{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg3)}

/* ============================================================================
   App frame (adapted from app.css)
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);background:var(--gray-100);color:var(--fg1);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit}
::selection{background:var(--blue-100)}
.app{display:flex;height:100vh;overflow:hidden;background:var(--gray-25)}

.rail{width:62px;flex:none;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .mark{width:34px;height:34px;border-radius:9px;background:var(--blue-600);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.rail-btn{width:38px;height:38px;border:0;background:transparent;border-radius:10px;color:var(--fg4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .14s,color .14s}
.rail-btn:hover{background:var(--gray-100);color:var(--fg2)}
.rail-btn.active{background:var(--blue-50);color:var(--accent)}
.rail-spacer{flex:1}

.nav{width:256px;flex:none;background:var(--gray-50);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto}
.profile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;transition:background .14s}
.profile:hover{background:var(--gray-100)}
.profile .who{min-width:0;flex:1}
.profile .who b{display:block;font-size:13.5px;font-weight:600;color:var(--fg1);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who span{display:block;font-size:11.5px;color:var(--fg4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sep{height:1px;background:var(--border);margin:12px 4px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg4);padding:6px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;color:var(--fg2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s}
.nav-item .ni-ico{color:var(--fg4);flex:none;transition:color .14s}
.nav-item:hover{background:var(--gray-100);color:var(--fg1)}
.nav-item:hover .ni-ico{color:var(--fg3)}
.nav-item.active{background:var(--ink);color:#fff}
.nav-item.active .ni-ico{color:#fff}
.nav-item .ni-count{margin-left:auto;font:var(--text-mono);font-size:11px;color:var(--fg4)}
.nav-item.active .ni-count{color:rgba(255,255,255,.6)}
.nav-item .ni-chip{margin-left:auto}
.nav-foot{margin-top:auto;padding-top:12px}
.upsell{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px;box-shadow:var(--shadow-xs)}
.upsell b{font-size:13px;color:var(--fg1);display:flex;align-items:center;gap:7px}
.upsell p{margin:6px 0 0;font-size:12px;color:var(--fg3);line-height:1.45}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--white)}
.topbar .ttl{min-width:0}
.topbar h1{margin:0;font:var(--text-h2);color:var(--fg1);letter-spacing:0;white-space:nowrap}
.topbar .crumb{font-size:12.5px;color:var(--fg4);margin-top:2px;display:flex;align-items:center;gap:6px}
.topbar .grow{flex:1}

.scroll{flex:1;overflow-y:auto;padding:22px 24px 80px}
.content{max-width:1120px;margin:0 auto}

/* ---------- "Viewing as" persona switcher ---------- */
.persona{display:flex;align-items:center;gap:9px;background:var(--gray-50);border:1px solid var(--border-strong);border-radius:10px;padding:5px 8px 5px 6px;cursor:pointer;position:relative;transition:background .14s}
.persona:hover{background:var(--gray-100)}
.persona .eyebrow{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg4);line-height:1}
.persona .pn{font-size:13px;font-weight:600;color:var(--fg1);line-height:1.25;white-space:nowrap}
.persona .pr{font-size:11px;color:var(--fg3);line-height:1.1;white-space:nowrap}
.persona .pmeta{display:flex;flex-direction:column;gap:2px;text-align:left}
.pmenu{position:absolute;top:calc(100% + 8px);right:0;width:330px;background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow-lg);padding:6px;z-index:30}
.pmenu .pm-h{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg4);padding:8px 10px 4px}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer}
.pmenu button:hover{background:var(--gray-50)}
.pmenu button.on{background:var(--blue-50)}
.pmenu .pm-meta{min-width:0;flex:1}
.pmenu .pm-meta b{display:block;font-size:13px;color:var(--fg1);font-weight:600}
.pmenu .pm-meta span{display:block;font-size:11.5px;color:var(--fg3)}
.pmenu .pm-meta span.scope{color:var(--accent);font-weight:600;margin-top:1px}
.pmenu .ck{margin-left:auto;color:var(--accent);flex:none}

/* ---------- Avatars ---------- */
.avatar{border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--blue-400),var(--blue-600))}
.avatar.g1{background:linear-gradient(135deg,#6981F8,#1B43E5)}
.avatar.g2{background:linear-gradient(135deg,#14A05A,#0c7a43)}
.avatar.g3{background:linear-gradient(135deg,#D88A00,#b06f00)}
.avatar.g4{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.avatar.g5{background:linear-gradient(135deg,#E5484D,#b81f24)}
.avatar.g6{background:linear-gradient(135deg,#0ea5b5,#0c7d89)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-sans);font-weight:600;font-size:13.5px;line-height:1;border-radius:9px;border:1px solid transparent;padding:9px 15px;cursor:pointer;white-space:nowrap;transition:background .14s,box-shadow .14s,border-color .14s,transform .04s}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#22262e}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-hover)}
.btn-secondary{background:#fff;color:var(--fg1);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.btn-secondary:hover{background:var(--gray-50)}
.btn-ghost{background:transparent;color:var(--fg2)}
.btn-ghost:hover{background:var(--gray-100);color:var(--fg1)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{background:var(--gray-100);color:var(--gray-400);border-color:transparent;cursor:not-allowed;box-shadow:none}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#c93a3f}

/* ---------- Generic card ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.pad{padding:18px 20px}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font:var(--text-caption);font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip .i{width:12px;height:12px}
.chip.gray{background:var(--gray-100);color:var(--fg2)}
.chip.blue{background:var(--blue-50);color:var(--accent)}
.chip.green{background:var(--success-bg);color:var(--success)}
.chip.red{background:var(--danger-bg);color:var(--danger)}
.chip.amber{background:var(--warning-bg);color:var(--warning)}
.chip.ink{background:var(--ink);color:#fff}
.mono{font:var(--text-mono);font-feature-settings:"tnum" 1}

/* ---------- Hero / Program Home ---------- */
.home-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:980px){.home-grid{grid-template-columns:1fr}}
.hero{background:var(--ink);color:#fff;border-radius:var(--radius-xl);padding:22px 24px;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow-md);margin-bottom:18px}
.hero .ring{width:96px;height:96px;flex:none;position:relative;display:flex;align-items:center;justify-content:center}
.hero .ring .num{font:var(--text-metric);font-size:34px;color:#fff;letter-spacing:var(--tracking-tight)}
.hero .htxt .sm-overline{color:rgba(255,255,255,.55)}
.hero .htxt h2{margin:4px 0 6px;font:var(--text-h3);color:#fff}
.hero .htxt p{margin:0;font-size:13px;color:rgba(255,255,255,.62);max-width:460px;line-height:1.5}
.hero .hmeta{margin-left:auto;text-align:right;font-size:12px;color:rgba(255,255,255,.55)}
.hero .hmeta b{display:block;color:#fff;font-size:13px;margin-bottom:2px}

.sec-h{display:flex;align-items:center;gap:10px;margin:4px 0 13px}
.sec-h h3{margin:0;font:var(--text-h4);color:var(--fg1)}
.sec-h .grow{flex:1}

/* phase timeline cards */
.ptl{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:15px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .04s;position:relative;overflow:hidden}
.pcard:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.pcard:active{transform:translateY(.5px)}
.pcard .pc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pcard .pc-no{font:var(--text-mono);font-size:11px;color:var(--fg4);font-weight:600}
.pcard h4{margin:0 0 4px;font-size:14.5px;font-weight:600;color:var(--fg1);line-height:1.25}
.pcard .win{font:var(--text-caption);color:var(--fg4)}
.pcard .pc-prog{margin-top:13px}
.prog{height:6px;border-radius:999px;background:var(--gray-150);overflow:hidden}
.prog span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog.green span{background:var(--success)}
.prog.amber span{background:var(--warning)}
.pcard .pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.pcard .pc-foot .pct{font:var(--text-mono);font-size:11.5px;color:var(--fg2);font-weight:600}
.pcard .lockline{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg4);margin-top:9px}
.pcard .lockline .i{width:12px;height:12px}

/* blockers rail */
.rail-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.rail-card .rc-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.rail-card .rc-h h3{margin:0;font:var(--text-h4)}
.rail-card .rc-h .cnt{margin-left:auto}
.blk{padding:13px 16px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .14s}
.blk:last-child{border-bottom:0}
.blk:hover{background:var(--gray-50)}
.blk .bk-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.blk .bk-age{margin-left:auto;font:var(--text-caption);color:var(--fg4)}
.blk p{margin:0 0 7px;font-size:13px;color:var(--fg1);font-weight:500;line-height:1.4}
.blk .own{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg3)}

/* ---------- Tabs ---------- */
.tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;padding:11px 4px;margin-right:22px;font-size:13.5px;font-weight:600;color:var(--fg3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .14s}
.tab:hover{color:var(--fg1)}
.tab.on{color:var(--fg1);border-bottom-color:var(--ink)}
.tab .c{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;font:var(--text-mono);font-size:10.5px;font-weight:600;border-radius:999px;background:var(--gray-150);color:var(--fg3)}
.tab.on .c{background:var(--blue-50);color:var(--accent)}

/* ---------- Overview ---------- */
.ov-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:900px){.ov-grid{grid-template-columns:1fr}}
.goal{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px}
.goal .sm-overline{color:var(--accent)}
.goal p{margin:7px 0 0;font-size:14.5px;line-height:1.5;color:var(--fg1)}
.metarow{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:18px}
.meta{min-width:120px}
.meta .k{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg4);margin-bottom:5px}
.meta .v{font-size:13.5px;color:var(--fg1);font-weight:600;display:flex;align-items:center;gap:7px}
.dep{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:8px}
.dep .i{flex:none}
.dep .dp-b{flex:1;min-width:0}
.dep .dp-b b{font-size:13px;color:var(--fg1);display:block}
.dep .dp-b span{font-size:11.5px;color:var(--fg3)}
.subtle{font-size:12.5px;color:var(--fg4);line-height:1.5}

/* ---------- Data objects table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.tbl th{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg4);text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--gray-50);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--fg2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--gray-25)}
.obj-name{font-size:13.5px;font-weight:600;color:var(--fg1)}
.obj-why{font-size:11.5px;color:var(--fg4);margin-top:2px;display:flex;align-items:center;gap:5px}
.sync{display:inline-flex;align-items:center;gap:6px;font:var(--text-caption);font-weight:600;color:var(--success)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(20,160,90,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,160,90,.45)}70%{box-shadow:0 0 0 6px rgba(20,160,90,0)}100%{box-shadow:0 0 0 0 rgba(20,160,90,0)}}
.method{display:inline-flex;align-items:center;gap:5px;font:var(--text-caption);font-weight:600;padding:3px 9px;border-radius:6px}
.method.derived{background:var(--gray-100);color:var(--fg2)}
.method.confirmed{background:var(--blue-50);color:var(--accent)}
.method.collected{background:var(--warning-bg);color:var(--warning)}
.method.generated{background:#efe9ff;color:#6d28d9}
.lockicon{color:var(--fg4)}

/* ---------- Kanban ---------- */
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
@media(max-width:900px){.kan{grid-template-columns:repeat(2,1fr)}}
.kcol{background:var(--gray-50);border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px;min-height:120px}
.kcol .kc-h{display:flex;align-items:center;gap:7px;margin-bottom:11px;padding:2px 4px}
.kcol .kc-h b{font-size:12.5px;font-weight:600;color:var(--fg2)}
.kcol .kc-h .c{margin-left:auto;font:var(--text-mono);font-size:11px;color:var(--fg4)}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow-xs);margin-bottom:9px;cursor:pointer;transition:box-shadow .14s,transform .04s}
.kcard:hover{box-shadow:var(--shadow-md)}
.kcard:active{transform:translateY(.5px)}
.kcard p{margin:0 0 9px;font-size:13px;color:var(--fg1);font-weight:500;line-height:1.4}
.kcard .kf{display:flex;align-items:center;gap:8px}
.kcard .kf .due{font:var(--text-caption);color:var(--fg4);display:flex;align-items:center;gap:4px}
.kcard .kf .due .i{width:12px;height:12px}
.kcard .ref{display:inline-flex;align-items:center;gap:5px;font:var(--text-caption);font-weight:600;color:var(--accent);background:var(--blue-50);padding:2px 7px;border-radius:6px;margin-bottom:9px}

/* ---------- Exit criteria ---------- */
.exit-intro{display:flex;align-items:center;gap:12px;background:var(--gray-50);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;margin-bottom:16px}
.exit-intro .i{flex:none;color:var(--accent)}
.exit-intro div{font-size:13px;color:var(--fg2);line-height:1.45}
.exit-intro b{color:var(--fg1)}
.crit{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:16px;margin-bottom:12px}
.crit.met{border-color:var(--success);background:linear-gradient(0deg,var(--success-bg),#fff 60%)}
.crit.locked{opacity:.92}
.crit .ct-top{display:flex;align-items:flex-start;gap:12px}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:.14s;margin-top:1px}
.cbox.on{background:var(--success);border-color:var(--success);color:#fff}
.cbox.dis{cursor:not-allowed;background:var(--gray-100);border-color:var(--border)}
.crit .ct-b{flex:1;min-width:0}
.crit .ct-b h4{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--fg1);line-height:1.4}
.crit .ct-b .ev{font-size:12px;color:var(--fg4);display:flex;align-items:center;gap:6px;margin-top:7px}
.crit .ct-b .ev a{color:var(--accent);text-decoration:none;font-weight:600}
.live-metric{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--gray-50);border:1px solid var(--border);border-radius:9px}
.live-metric .lm-bar{flex:1;height:7px;border-radius:999px;background:var(--gray-200);overflow:hidden}
.live-metric .lm-bar span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.live-metric .lm-bar span.ok{background:var(--success)}
.live-metric .lm-num{font:var(--text-mono);font-size:12px;font-weight:600;color:var(--fg1);white-space:nowrap}
.live-metric .lm-tgt{font:var(--text-caption);color:var(--fg4);white-space:nowrap}
.signoff{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:13px;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.keypill{display:inline-flex;align-items:center;gap:6px;font:var(--text-caption);font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--border)}
.keypill.done{background:var(--success-bg);color:var(--success);border-color:transparent}
.keypill.wait{background:var(--gray-50);color:var(--fg4)}
.dep-warn{display:flex;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 12px;background:var(--warning-bg);border:1px solid #f0d9a8;border-radius:9px;font-size:12.5px;color:#8a5d00;line-height:1.45}
.dep-warn .i{flex:none;color:var(--warning);margin-top:1px}

/* ---------- Activity ---------- */
.feed{position:relative;padding-left:8px}
.fitem{display:flex;gap:12px;padding-bottom:18px;position:relative}
.fitem:before{content:"";position:absolute;left:15px;top:32px;bottom:-2px;width:2px;background:var(--gray-150)}
.fitem:last-child:before{display:none}
.fitem .fav{flex:none;z-index:1}
.fitem .fb{flex:1;min-width:0;padding-top:2px}
.fitem .fb .fh{font-size:13px;color:var(--fg2);line-height:1.5}
.fitem .fb .fh b{color:var(--fg1);font-weight:600}
.fitem .fb .ft{font:var(--text-caption);color:var(--fg4);margin-top:1px}
.fitem .pin{display:inline-flex;align-items:center;gap:5px;font:var(--text-caption);font-weight:600;color:var(--accent);margin-bottom:4px}
.fitem .quote{margin-top:7px;padding:10px 13px;background:var(--gray-50);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;font-size:13px;color:var(--fg1);line-height:1.5}
.composer{display:flex;gap:10px;margin-top:6px;margin-bottom:20px}
.composer .field{flex:1}
.field{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;transition:border-color .14s,box-shadow .14s}
.field:focus-within{border-color:var(--accent);box-shadow:var(--ring-focus)}
.field input,.field textarea{border:0;outline:0;background:transparent;font:var(--text-body);color:var(--fg1);width:100%;resize:none}
.field input::placeholder,.field textarea::placeholder{color:var(--fg4)}

/* ---------- Queues (Phase 3 / 4) ---------- */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.qbar .grow{flex:1}
.seg{display:inline-flex;background:var(--gray-50);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--fg3);padding:6px 12px;border-radius:6px;cursor:pointer;transition:.14s}
.seg button.on{background:#fff;color:var(--fg1);box-shadow:var(--shadow-xs)}
.coverage{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:15px 18px;margin-bottom:16px}
.coverage .cv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.coverage .cv-top b{font-size:13.5px;color:var(--fg1)}
.coverage .cv-num{font:var(--text-metric);font-size:26px;color:var(--fg1);letter-spacing:var(--tracking-tight)}
.coverage .cv-num small{font-size:14px;color:var(--fg3);font-weight:500}
.cv-track{height:10px;border-radius:999px;background:var(--gray-150);overflow:hidden;position:relative}
.cv-track span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue-400),var(--accent));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.cv-track .gate{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.cv-gatelbl{display:flex;justify-content:flex-end;margin-top:6px;font:var(--text-caption);color:var(--fg4)}

.qcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:15px 16px;margin-bottom:12px;transition:box-shadow .15s,opacity .3s,transform .3s}
.qcard.cleared{opacity:.5}
.qcard .qc-grid{display:grid;grid-template-columns:1fr 36px 1fr;gap:14px;align-items:center}
@media(max-width:760px){.qcard .qc-grid{grid-template-columns:1fr}}
.qside .ql{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg4);margin-bottom:6px}
.qside .qv{font-size:14px;font-weight:600;color:var(--fg1)}
.qside .qmono{font:var(--text-mono);font-size:11.5px;color:var(--fg3);margin-top:3px}
.qside.prop{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:11px 13px}
.qarrow{display:flex;align-items:center;justify-content:center;color:var(--fg4)}
.qc-foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.confidence{display:inline-flex;align-items:center;gap:8px}
.confidence .cf-bar{width:90px;height:6px;border-radius:999px;background:var(--gray-150);overflow:hidden}
.confidence .cf-bar span{display:block;height:100%;border-radius:999px}
.confidence .cf-num{font:var(--text-mono);font-size:12px;font-weight:600}
.qc-foot .acts{margin-left:auto;display:flex;gap:8px}

/* counterparty rows */
.cpt{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:14px 16px;margin-bottom:11px}
.cpt .cp-top{display:flex;align-items:center;gap:11px}
.cpt .rank{width:26px;height:26px;border-radius:7px;background:var(--gray-100);color:var(--fg3);font:var(--text-mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.cpt .cp-name b{font-size:14px;color:var(--fg1);font-weight:600}
.cpt .cp-name span{font-size:11.5px;color:var(--fg4);display:block}
.cpt .cp-vol{margin-left:auto;text-align:right}
.cpt .cp-vol .vn{font:var(--text-mono);font-size:13px;font-weight:600;color:var(--fg1)}
.cpt .cp-vol .vl{font:var(--text-caption);color:var(--fg4)}
.cpt .cp-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:13px;padding-top:13px;border-top:1px solid var(--gray-100)}
@media(max-width:760px){.cpt .cp-fields{grid-template-columns:1fr}}
.flabel{display:block;font-size:11.5px;font-weight:500;color:var(--fg3);margin-bottom:5px}

/* discrepancy builder */
.dr-steps{display:flex;flex-direction:column;gap:0;margin-bottom:18px}
.dstep{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--gray-100)}
.dstep:last-child{border-bottom:0}
.dstep .dnum{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-strong);color:var(--fg4);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.dstep.done .dnum{background:var(--success);border-color:var(--success);color:#fff}
.dstep .ds-b{flex:1}
.dstep .ds-b b{font-size:13.5px;color:var(--fg1)}
.dstep .ds-b p{margin:3px 0 0;font-size:12.5px;color:var(--fg3);line-height:1.45}
.var-tbl td .fac{font-weight:600;color:var(--fg1)}
.aging{font:var(--text-mono);font-size:11.5px}
.locktag{display:inline-flex;align-items:center;gap:6px;font:var(--text-caption);font-weight:600;color:var(--warning);background:var(--warning-bg);padding:5px 11px;border-radius:999px}

/* ---------- People / table-ish ---------- */
.ppl-row{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:13px 16px;margin-bottom:10px}
.ppl-row .pp-b{min-width:0}
.ppl-row .pp-b b{font-size:14px;color:var(--fg1);font-weight:600}
.ppl-row .pp-b span{font-size:12px;color:var(--fg4);display:block}
.ppl-row .pp-roles{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:55%}
.rolechip{display:inline-flex;align-items:center;gap:5px;font:var(--text-caption);font-weight:600;padding:3px 9px;border-radius:7px;background:var(--gray-100);color:var(--fg2)}
.rolechip.mgr{background:var(--blue-50);color:var(--accent)}
.rolechip.lead{background:var(--ink);color:#fff}

/* audit */
.audit-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--gray-100)}
.audit-row .a-ico{width:34px;height:34px;border-radius:9px;background:var(--gray-50);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg3);flex:none}
.audit-row .a-b{flex:1;min-width:0}
.audit-row .a-b p{margin:0;font-size:13px;color:var(--fg1);line-height:1.45}
.audit-row .a-b p b{font-weight:600}
.audit-row .a-t{font:var(--text-mono);font-size:11px;color:var(--fg4);white-space:nowrap}

/* risk */
.risk{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:15px 16px;margin-bottom:12px}
.risk .rk-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.risk h4{margin:0;font-size:14px;font-weight:600;color:var(--fg1);flex:1}
.risk p{margin:0;font-size:13px;color:var(--fg3);line-height:1.5}
.risk .rk-meta{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:12px;color:var(--fg4)}
.risk .rk-meta b{color:var(--fg2)}

/* lock/restricted screen */
.locked-view{max-width:520px;margin:60px auto;text-align:center}
.locked-view .lk-ico{width:62px;height:62px;border-radius:16px;background:var(--gray-50);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg4);margin:0 auto 18px}
.locked-view h2{margin:0 0 8px;font:var(--text-h3)}
.locked-view p{margin:0 auto;font-size:14px;color:var(--fg3);line-height:1.6;max-width:400px}

/* empty / banner */
.banner{display:flex;align-items:center;gap:11px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:11px;padding:11px 15px;margin-bottom:18px;font-size:13px;color:var(--fg2);line-height:1.45}
.banner .i{color:var(--accent);flex:none}
.banner b{color:var(--fg1)}

.redacted{display:inline-flex;align-items:center;gap:7px;background:var(--gray-50);border:1px dashed var(--border-strong);border-radius:9px;padding:9px 12px;font-size:12.5px;color:var(--fg3)}
.redacted .i{color:var(--fg4)}

/* ---------- Slide-over panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.34);opacity:0;pointer-events:none;z-index:40;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:-560px;height:100vh;width:460px;max-width:94vw;background:#fff;z-index:50;box-shadow:var(--shadow-xl);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:right .26s cubic-bezier(.2,.8,.2,1)}
.panel.show{right:0}
.panel-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border)}
.panel-head h2{margin:0;font:var(--text-h3);color:var(--fg1)}
.panel-head .x{margin-left:auto}
.panel-body{flex:1;overflow-y:auto;padding:20px 22px}
.panel-foot{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
.panel-foot .grow{flex:1}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:9px;color:var(--fg3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .14s,color .14s}
.icon-btn:hover{background:var(--gray-50);color:var(--fg1)}
.fblabel{display:block;font-size:12.5px;font-weight:600;color:var(--fg2);margin-bottom:7px}
.fb-context{display:flex;align-items:center;gap:8px;background:var(--gray-50);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:16px;font-size:12.5px;color:var(--fg3)}
.fb-context b{color:var(--fg1)}
.fb-note{background:var(--gray-50);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:10px}
.fb-note .fn-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.fb-note .fn-where{font:var(--text-caption);font-weight:600;color:var(--accent)}
.fb-note .fn-time{margin-left:auto;font:var(--text-caption);color:var(--fg4)}
.fb-note p{margin:0;font-size:13px;color:var(--fg1);line-height:1.45}
.fb-note .fn-del{border:0;background:transparent;color:var(--fg4);cursor:pointer;padding:2px;display:flex}
.fb-note .fn-del:hover{color:var(--danger)}
.fb-empty{text-align:center;color:var(--fg4);font-size:13px;padding:24px 0}

/* feedback FAB */
.fab{position:fixed;bottom:22px;right:22px;z-index:35;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-lg);transition:background .14s,transform .04s}
.fab:hover{background:var(--accent-hover)}
.fab:active{transform:translateY(.5px)}
.fab .badge{background:#fff;color:var(--accent);font:var(--text-mono);font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .i{color:var(--success)}

/* demo ribbon in rail */
.proto-tag{writing-mode:vertical-rl;font:var(--text-overline);letter-spacing:.12em;text-transform:uppercase;color:var(--fg4);margin-top:4px}
.divider{height:1px;background:var(--gray-100);margin:18px 0}
.flex{display:flex}.ai-c{align-items:center}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.wrap{flex-wrap:wrap}
.mb0{margin-bottom:0}.mt16{margin-top:16px}.mt8{margin-top:8px}
.muted-card{background:var(--gray-50);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:26px;text-align:center;color:var(--fg4);font-size:13px}
.subms{display:flex;flex-direction:column;gap:10px}
.subm{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.subm .sm-no{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:var(--text-mono);font-size:11px;font-weight:700;flex:none}
.subm.done .sm-no{background:var(--success);color:#fff}
.subm.active .sm-no{background:var(--accent);color:#fff}
.subm.todo .sm-no{background:var(--gray-100);color:var(--fg4)}
.subm .sm-b{flex:1}
.subm .sm-b b{font-size:13.5px;color:var(--fg1)}
.subm .sm-b span{font-size:12px;color:var(--fg4);display:block}
</style>
</head>
<body>
<div id="root"></div>

<div class="scrim" id="scrim" onclick="closePanel()"></div>

  <div class="panel-head">
    <span style="width:30px;height:30px;border-radius:8px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;color:var(--accent)"><i data-lucide="message-square-text"></i></span>
    <h2>Feedback</h2>

function visiblePhases(){
  const p=persona();
  if(p.lead||p.sponsor) return PHASES.map(x=>x.id);
  return Object.keys(p.phases||{}).map(Number).sort((a,b)=>a-b);
}
function roleInPhase(pid){
  const p=persona();
  if(p.lead) return "Program Lead";
  if(p.sponsor) return "Viewer";
  return (p.phases||{})[pid] || null;
}

  const r=roleInPhase(pid);
  return r==="Program Lead"||r==="Phase Manager"||r==="Contributor";
}

/* ---------------- VIEWS ---------------- */
function viewHTML(){
  if(STATE.view==="home"){ if(!canSeeProgram()) return lockedView("Program home is for Program Leads and the Executive Sponsor","Your access is scoped to the phases you're assigned to. The bird's-eye view stays with the two leads and the sponsor."); return homeHTML(); }
  if(STATE.view==="people"){ if(!persona().lead) return lockedView("People & access is leads-only","Adding and assigning users is restricted to the two Program Leads — a deliberate SOC 2 control. Phase managers can request an addition instead."); return peopleHTML(); }
  if(STATE.view==="risk"){ if(!persona().lead) return lockedView("Risk register is leads-only","Risks surface inside the phases they affect. The consolidated register stays with the leads."); return riskHTML(); }
  if(STATE.view==="audit"){ if(!persona().lead) return lockedView("Audit log is leads-only","Every permission change is logged as SOC 2 evidence and visible only to the Program Leads."); return auditHTML(); }
  if(STATE.view==="phase"){
    const r=roleInPhase(STATE.phase);
    if(!r) return lockedView("You don't have access to this phase","Ask a Program Lead to grant you access. Phase-scoped permissions keep each person's surface area small.");
    return phaseHTML();
  }
  return "";
}

/* ---- Phase workspace ---- */
function phaseHTML(){
  const ph=PHASES[STATE.phase];
  const r=roleInPhase(STATE.phase);
  const sm=STATUS_META[ph.status];
  const tabs=[
    {id:"overview",label:"Overview",icon:"layout-list"},
    {id:"objects",label:"Data objects",icon:"database",c:ph.objects.length},
    {id:"tasks",label:"Tasks",icon:"check-square",c:ph.tasks.length},
    {id:"exit",label:"Exit criteria",icon:"flag",c:ph.criteria.length},
    {id:"activity",label:"Activity",icon:"messages-square"},
  ];
  if(ph.module==="exceptions") tabs.splice(1,0,{id:"module",label:"Exception queue",icon:"git-pull-request-arrow",c:EXCEPTIONS.length});
  if(ph.module==="counterparty") tabs.splice(1,0,{id:"module",label:"Annotation queue",icon:"list-checks",c:COUNTERPARTIES.length});
  if(ph.module==="discrepancy") tabs.splice(1,0,{id:"module",label:"Report builder",icon:"file-bar-chart-2"});

  if(!tabs.some(t=>t.id===STATE.tab)) STATE.tab="overview";

  let body="";
  if(STATE.tab==="overview") body=ovHTML(ph,r);
  else if(STATE.tab==="objects") body=objectsHTML(ph,r);
  else if(STATE.tab==="tasks") body=tasksHTML(ph,r);
  else if(STATE.tab==="exit") body=exitHTML(ph,r);
  else if(STATE.tab==="activity") body=activityHTML(ph,r);
  else if(STATE.tab==="module"){
    if(ph.module==="exceptions") body=exceptionsHTML(ph,r);
    else if(ph.module==="counterparty") body=counterpartyHTML(ph,r);
    else if(ph.module==="discrepancy") body=discrepancyHTML(ph,r);
  }

  const roleChip = persona().lead?`<span class="rolechip lead"><i data-lucide="crown" style="width:12px;height:12px"></i>${esc(r)}</span>`
    : `<span class="rolechip ${isManager(STATE.phase)?'mgr':''}">${esc(r)}</span>`;

  return `
    <div class="flex ai-c gap10 wrap" style="margin-bottom:16px">
      <span class="chip ${sm.chip}" style="font-size:12.5px;padding:5px 11px">${esc(sm.label)}</span>
      <span class="sm-body-sm" style="color:var(--fg4);font-size:12.5px">Your role here ·</span> ${roleChip}
      ${persona().readonly?`<span class="rolechip"><i data-lucide="eye" style="width:12px;height:12px"></i>Read-only</span>`:""}
      <span class="grow" style="flex:1"></span>
      <span class="sm-body-sm" style="color:var(--fg4);font-size:12.5px">${phaseProgress(ph.id)}% complete</span>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab ${STATE.tab===t.id?"on":""}" onclick="setTab('${t.id}')">
        <i data-lucide="${t.icon}" style="width:15px;height:15px"></i>${esc(t.label)}${t.c!=null?`<span class="c">${t.c}</span>`:""}</button>`).join("")}
    </div>
    ${body}`;
}

function ovHTML(ph,r){
  const upstream = ph.feeds.map(f=>PHASES[f]);
  const downstream = PHASES.filter(p=>p.feeds.includes(ph.id));
  const sarahScoped = !persona().lead && !persona().sponsor;
  return `
  <div class="goal"><div class="sm-overline">Phase goal · from the playbook</div><p>${esc(ph.goal)}</p></div>

        <div class="meta"><div class="k">Target window</div><div class="v"><i data-lucide="calendar" style="width:15px;height:15px;color:var(--fg4)"></i>${esc(ph.window)}</div></div>
        <div class="meta"><div class="k">Status</div><div class="v">${statusChip(ph.status)}</div></div>
        <div class="meta"><div class="k">Phase manager</div><div class="v">${avatarInline(ph.mgr.initials,ph.mgr.g)} ${esc(ph.mgr.name)}</div></div>

      <div class="sm-body-sm" style="color:var(--fg4);margin:14px 0 9px;font-size:12.5px">Depends on this phase</div>
      ${downstream.length?downstream.map(u=>depRowHTML(u,sarahScoped)).join(""):`<div class="subtle">Terminal phase — ${esc(ph.dependsLabel)}</div>`}

        <div class="divider"></div>
        <div class="sm-body-sm" style="font-size:12.5px;color:var(--fg3);line-height:1.5">${esc(ph.dependsLabel)}</div>

        <div class="sm-overline" style="margin-bottom:12px">Internal sequencing</div>

      </div>`:""}
    </div>
  </div>`;
}

function depRowHTML(u,scoped){

function gateLineHTML(ph){

/* ---- Exit criteria ---- */
function exitHTML(ph,r){
  const depOk = !ph.dep || depMet(ph);
  return `
  <div class="exit-intro"><i class="i" data-lucide="flag" style="width:20px;height:20px"></i>
    <div>The gate. Each criterion needs a <b>two-key sign-off</b> — the phase manager attests, then <b>both Program Leads countersign</b>. Quantitative criteria wire to live data; the checkbox only unlocks when the threshold is met.</div></div>
  ${!depOk?`<div class="dep-warn" style="margin-bottom:16px"><i class="i" data-lucide="lock" style="width:16px;height:16px"></i>
    <div><b>This phase cannot exit yet.</b> Upstream dependency unmet: <b>Phase ${ph.dep.multi?ph.dep.multi.join(" & "):ph.dep.phase}</b> must be complete. Criteria can be attested, but completion stays gated until ${ph.dep.multi?"those phases":"that phase"} clears — owned by the relevant phase managers.</div></div>`:""}
  ${ph.criteria.map((_,i)=>critHTML(ph,i,depOk)).join("")}`;
}

function critHTML(ph,i,depOk){
  const c=getCrit(ph.id,i);
  const live=c.live;
  const thresholdMet = live ? (live.cur>=live.tgt || c.met) : c.met;
  const canCheck = thresholdMet && depOk;
  const fullySigned = c.attested && c.leadA && c.leadB;
  const meAttest = isManager(ph.id) && !persona().readonly;
  const meLead = persona().lead;
  return `<div class="crit ${fullySigned?'met':''} ${!depOk?'locked':''}">
    <div class="ct-top">
      <div class="cbox ${c.attested?'on':''} ${!canCheck&&!c.attested?'dis':''}" onclick="${meAttest&&canCheck?`attest(${ph.id},${i})`:`toast('${!canCheck?(live?'Threshold not met — '+live.cur+live.unit+' of '+live.tgt+live.unit:'Not yet ready'):'Only the phase manager can attest (first key)'}')`}">
        ${c.attested?'<i data-lucide="check" style="width:14px;height:14px"></i>':''}</div>
      <div class="ct-b">
        <h4>${esc(c.t)}</h4>
        <div class="ev"><i data-lucide="${c.ev.type==='obj'?'database':'paperclip'}" style="width:13px;height:13px"></i>Evidence · <a onclick="toast('Open evidence: ${esc(c.ev.label)}')">${esc(c.ev.label)}</a></div>
        ${live?`<div class="live-metric">
          <span class="mono lm-num">${live.cur}${live.unit}</span>
          <div class="lm-bar"><span class="${live.cur>=live.tgt?'ok':''}" style="width:${Math.min(100,(live.cur/live.target)*100)}%"></span></div>
          <span class="lm-tgt">target ${live.tgt}${live.unit}</span>
        </div>`:""}
        <div class="signoff">
          <span class="keypill ${c.attested?'done':'wait'}"><i data-lucide="${c.attested?'check':'circle'}" style="width:13px;height:13px"></i>Manager attest</span>
          <span class="keypill ${c.leadA?'done':'wait'}"><i data-lucide="${c.leadA?'check':'circle'}" style="width:13px;height:13px"></i>Trellis lead</span>
          <span class="keypill ${c.leadB?'done':'wait'}"><i data-lucide="${c.leadB?'check':'circle'}" style="width:13px;height:13px"></i>Curaleaf lead</span>
          <span class="grow" style="flex:1"></span>
          ${c.attested&&!fullySigned&&meLead?`<button class="btn btn-accent btn-sm" onclick="countersign(${ph.id},${i})"><i data-lucide="pen-line" style="width:13px;height:13px"></i>Countersign</button>`:""}
          ${c.attested&&!fullySigned&&!meLead?`<span class="chip amber"><i class="i" data-lucide="clock"></i>Awaiting countersign</span>`:""}
          ${fullySigned?`<span class="chip green"><i class="i" data-lucide="check-circle-2"></i>Countersigned</span>`:""}
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================================================================
   COMPUTED HELPERS
   ========================================================================== */
function depMet(ph){
  if(!ph.dep) return true;
  if(ph.dep.multi) return ph.dep.multi.every(p=>PHASES[p].status==="complete");
  return PHASES[ph.dep.phase].status==="complete";
}
function phaseProgress(pid){
  const ph=PHASES[pid];
  const objs=ph.objects, crits=ph.criteria, tasks=ph.tasks;
  const objScore = objs.length? objs.filter(o=>o.status==="Validated").length/objs.length : 1;
  const taskScore = tasks.length? tasks.filter(t=>t.col==="done").length/tasks.length : 1;
  const critScore = crits.length? crits.map((_,i)=>{const c=getCrit(pid,i);return (c.attested&&c.leadA&&c.leadB)?1:0;}).reduce((a,b)=>a+b,0)/crits.length : 0;
  return Math.round((objScore*0.4 + taskScore*0.2 + critScore*0.4)*100);
}
function statusChip(s){const m=STATUS_META[s];return `<span class="chip ${m.chip}">${m.label}</span>`;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function initials(name){
  if(!name) return "?";
  const map={"MW":"MW","SC":"SC","PN":"PN","BY":"BY","DR":"DR","Finance":"CF","Legal":"CL","Trellis ER":"TE","Trellis Sec":"TS","Curaleaf IT":"IT"};
  if(map[name]) return map[name];
  const parts=name.split(" ");
  return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase();
}
function avG(who){
  const m={"MW":"g1","SC":"g4","PN":"g6","BY":"g1","DR":"g3","Finance":"g5","Legal":"g2","Trellis ER":"g4","Trellis Sec":"g1","Curaleaf IT":"g5"};
  return m[who]||"g1";
}
function avatar(init,size,g){return `<span class="avatar ${g||''}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px">${esc(init)}</span>`;}
function avatarInline(init,g,size){size=size||20;return `<span class="avatar ${g||''}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px;vertical-align:middle">${esc(init)}</span>`;}
function logoMark(){return `<svg width="20" height="20" viewBox="0 0 48 48" fill="none"><path d="M13 30.5 L19 24 L24.5 28.5 L35 16" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35" cy="16" r="3.6" fill="#fff"/></svg>`;}
function ringSVG(d){
  const total=42, frac=Math.max(0,Math.min(1,(42-Math.min(42,42-d))/42));
  const pct = Math.max(0, Math.min(1, d/42));
  const r=42, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/>
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700" font-size="30" letter-spacing="-1">${d}</text></svg>`;
}

function go(view,phase){
  STATE.view=view; STATE.personaMenu=false;
  if(view==="phase"&&phase!=null){STATE.phase=phase; STATE.tab="overview";}
  render();
}
function setTab(t){STATE.tab=t; render();}
function setFilter(f){STATE.qFilter=f; render();}
function togglePersonaMenu(e){ if(e)e.stopPropagation(); STATE.personaMenu=!STATE.personaMenu; render(); }
function setPersona(k){
  STATE.persona=k; STATE.personaMenu=false;
  // route to a sensible landing screen for the persona
  if(canSeeProgram()) STATE.view="home";
  else { STATE.view="phase"; STATE.phase=visiblePhases()[0]; STATE.tab="overview"; }
  render();
  toast("Viewing as "+PERSONAS[k].name);
}
function attest(p,i){
  const k=critKey(p,i); SIGN[k]=SIGN[k]||{...PHASES[p].criteria[i]};
  SIGN[k].attested=true;
  render(); toast("Attested — first key. Awaiting both leads.");
}
function countersign(p,i){
  const k=critKey(p,i); SIGN[k]=SIGN[k]||{...PHASES[p].criteria[i]};
  // a lead countersigns their side; for the demo, one click completes both lead keys
  SIGN[k].leadA=true; SIGN[k].leadB=true;
  render(); toast("Countersigned by both leads — criterion locked.");
}
function clearException(id,action){
  STATE.cleared["e"+id]=action;
  const el=document.getElementById("e"+id);
  if(el){el.classList.add("cleared");}
  setTimeout(()=>render(),260);
  toast(action==="accept"?"Match accepted → canonical SKU":action==="reject"?"Match rejected":"Split into variants");
}
function toggleSession(){STATE.session=!STATE.session; if(STATE.session)STATE.qFilter="all"; render(); toast(STATE.session?"Working session started — NJ · confidence < 0.7 pre-loaded":"Session ended");}
function setPrebrief(){STATE.prebrief=true; render(); toast("Sponsor pre-briefed — share unlocked");}

}
function renderPanel(){
  const ctx=currentContext();
  const notes=FEEDBACK.slice().reverse();
  document.getElementById("panelBody").innerHTML=`
    <div class="fb-context"><i data-lucide="map-pin" style="width:14px;height:14px"></i>On screen · <b>${esc(ctx)}</b> · as ${esc(persona().role)}</div>
    <label class="fblabel">Your note</label>
    <div class="field" style="align-items:flex-start"><textarea id="fbText" rows="4" placeholder="What works, what's confusing, what's missing? Tied to this screen and persona."></textarea></div>
    <div class="divider"></div>
    <div class="flex ai-c gap8" style="margin-bottom:12px"><span class="sm-overline">Notes so far</span><span class="grow" style="flex:1"></span><span class="chip gray">${FEEDBACK.length}</span></div>
    ${notes.length?notes.map(n=>`<div class="fb-note">
      <div class="fn-top"><span class="fn-where">${esc(n.where)}</span><span class="fn-time">${esc(n.time)}</span>
        <button class="fn-del" onclick="deleteFeedback(${n.id})" title="Delete"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button></div>
      <p>${esc(n.text)}</p>
      <div class="sm-body-sm" style="font-size:11px;color:var(--fg4);margin-top:5px">as ${esc(n.role)}</div>
    </div>`).join(""):`<div class="fb-empty">No notes yet. Your feedback is saved locally in this browser.</div>`}
  `;
  window.lucide&&lucide.createIcons();
}
function submitFeedback(){
  const ta=document.getElementById("fbText");
  const text=(ta?.value||"").trim();
  if(!text){ toast("Write a note first"); return; }
  FEEDBACK.push({id:Date.now(), text, where:currentContext(), role:persona().role, time:new Date().toLocaleString()});
  persist();
  renderPanel(); refreshFab(); toast("Note saved");
}
function deleteFeedback(id){ FEEDBACK=FEEDBACK.filter(n=>n.id!==id); persist(); renderPanel(); refreshFab(); }
function persist(){ try{localStorage.setItem("ob_feedback",JSON.stringify(FEEDBACK));}catch(e){} }
function refreshFab(){
  const b=document.getElementById("fbCount");
  if(!b) return;
  if(FEEDBACK.length){b.style.display="inline-flex"; b.textContent=FEEDBACK.length;}
  else b.style.display="none";
}
function exportFeedback(){
  if(!FEEDBACK.length){ toast("No feedback to export yet"); return; }
  const lines=FEEDBACK.map(n=>`• [${n.where}] (as ${n.role}, ${n.time})\n  ${n.text}`).join("\n\n");
  const blob=new Blob([`Curaleaf Onboarding Dashboard — Feedback\n${new Date().toLocaleString()}\n\n${lines}\n`],{type:"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="onboarding-dashboard-feedback.txt"; a.click();
  URL.revokeObjectURL(url);
  if(navigator.clipboard) navigator.clipboard.writeText(lines).catch(()=>{});
  toast("Feedback exported (and copied)");
}

/* ---- toast ---- */
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  document.getElementById("toastMsg").textContent=msg;
  t.classList.add("show"); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

document.addEventListener("click",()=>{ if(STATE.personaMenu){STATE.personaMenu=false; render();} });

render();
</script>
</body>
</html>
